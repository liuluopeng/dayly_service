name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # sqlx query! 宏走仓库内 .sqlx 离线缓存（与 Dockerfile 一致，CI 无数据库）
  SQLX_OFFLINE: true

jobs:
  rust:
    name: Rust fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        # glib/gdk/webkit2gtk（src-tauri Tauri2 依赖链）：glib-sys/gdk-sys 需
        # glib-2.0.pc/gdk-3.0.pc，javascriptcore-rs-sys/soup3-sys 需 libwebkit2gtk-4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 缓存 cargo 依赖
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        # future_incompatible 忽略：block v0.1.6 是第三方间接依赖的已知弃用提示
        # 排除 webbvueetauri（Tauri 桌面端，cocoa 链仅在 macOS 可编译，Linux 无法检查）
        run: cargo clippy --workspace --exclude webbvueetauri -- -D warnings -A future_incompatible

      - name: Build tests
        # --lib --bins：跳过 examples（hello.rs 的 sqlx 查询无离线缓存，
        # 且离线类型推断与在线不一致，examples 非 CI 关注目标）
        run: cargo test --workspace --exclude webbvueetauri --no-run --lib --bins

      - name: Run tests
        # 排除 lx_dayly_service：其测试为集成测试（需 postgres/redis），CI 不提供；
        # common 依赖 localhost:23001 的集成测试已标 #[ignore]
        run: cargo test --workspace --exclude webbvueetauri --exclude lx_dayly_service --lib --bins

  frontend:
    name: Vue typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm i -g pnpm@11

      - name: Install dependencies
        working-directory: webbvueetauri
        run: pnpm install --frozen-lockfile

      # vue-tsc / vite 均引用 src-wasm/pkg（wasm-pack 产物，不入库），CI 需先构建
      - name: Setup Rust (wasm)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build wasm
        working-directory: webbvueetauri/src/src-wasm
        run: wasm-pack build

      - name: Typecheck
        working-directory: webbvueetauri
        # pnpm exec：强制用项目本地依赖（npx 会下载最新 vue-tsc 与 typescript 5.6 不兼容）
        run: pnpm exec vue-tsc --noEmit

      - name: Build
        working-directory: webbvueetauri
        run: pnpm build
