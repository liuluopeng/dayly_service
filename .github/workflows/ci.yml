name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        # glib-sys（webrtc 依赖链）需要 glib-2.0.pc，ubuntu runner 默认未安装
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 缓存 cargo 依赖
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        # future_incompatible 忽略：block v0.1.6 是第三方间接依赖的已知弃用提示
        run: cargo clippy --workspace -- -D warnings -A future_incompatible

      - name: Build tests
        run: cargo test --workspace --no-run

      - name: Run tests
        run: cargo test --workspace

  frontend:
    name: Vue typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm i -g pnpm@11

      - name: Install dependencies
        working-directory: webbvueetauri
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: webbvueetauri
        # pnpm exec：强制用项目本地依赖（npx 会下载最新 vue-tsc 与 typescript 5.6 不兼容）
        run: pnpm exec vue-tsc --noEmit

      - name: Build
        working-directory: webbvueetauri
        run: pnpm build
