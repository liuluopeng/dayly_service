name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # sqlx query! 宏走仓库内 .sqlx 离线缓存（与 Dockerfile 一致，CI 无数据库）
  SQLX_OFFLINE: true

jobs:
  rust:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        # glib/gdk/webkit2gtk（src-tauri Tauri2 依赖链）：glib-sys/gdk-sys 需
        # glib-2.0.pc/gdk-3.0.pc，javascriptcore-rs-sys/soup3-sys 需 libwebkit2gtk-4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # 缓存 cargo 依赖
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

  frontend:
    name: Vue typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm i -g pnpm@11

      # vue-tsc / vite 均引用 src-wasm/pkg（wasm-pack 产物，不入库），CI 需先构建
      - name: Setup Rust (wasm)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      # 与 Dockerfile / build-frontends.sh 共享同一构建脚本（唯一事实来源）
      - name: Build (shared script)
        run: bash scripts/build-vue.sh
