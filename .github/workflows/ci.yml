name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        # glib/gdk/webkit2gtk（src-tauri Tauri2 依赖链）：glib-sys/gdk-sys 需
        # glib-2.0.pc/gdk-3.0.pc，javascriptcore-rs-sys/soup3-sys 需 libwebkit2gtk-4.1
        run: sudo apt-get update && sudo apt-get install -y \
          libglib2.0-dev libgtk-3-dev pkg-config libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 缓存 cargo 依赖
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        # future_incompatible 忽略：block v0.1.6 是第三方间接依赖的已知弃用提示
        run: cargo clippy --workspace -- -D warnings -A future_incompatible

      - name: Build tests
        run: cargo test --workspace --no-run

      - name: Run tests
        run: cargo test --workspace

  frontend:
    name: Vue typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm i -g pnpm@11

      - name: Install dependencies
        working-directory: webbvueetauri
        run: pnpm install --frozen-lockfile

      # vue-tsc / vite 均引用 src-wasm/pkg（wasm-pack 产物，不入库），CI 需先构建
      - name: Setup Rust (wasm)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build wasm
        working-directory: webbvueetauri/src/src-wasm
        run: wasm-pack build

      - name: Typecheck
        working-directory: webbvueetauri
        # pnpm exec：强制用项目本地依赖（npx 会下载最新 vue-tsc 与 typescript 5.6 不兼容）
        run: pnpm exec vue-tsc --noEmit

      - name: Build
        working-directory: webbvueetauri
        run: pnpm build
