name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: 'true'

jobs:
  flutter-android:
    name: Flutter Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.0' # 与本地/Docker 构建一致
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install NDK + cargo-ndk
        run: |
          echo "y" | sdkmanager --install "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          cargo install cargo-ndk

      - name: Build APK
        working-directory: kongde
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-android-apk
          path: kongde/build/app/outputs/flutter-apk/*.apk

  flutter-macos:
    name: Flutter macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.0'
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Build macOS
        working-directory: kongde
        run: flutter build macos --release

      - name: Package app
        working-directory: kongde/build/macos/Build/Products/Release
        run: |
          APP_NAME=$(ls -d *.app | head -1)
          zip -r "${APP_NAME%.app}.zip" "$APP_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-macos
          path: kongde/build/macos/Build/Products/Release/*.zip

  vue-web:
    name: Vue Web + Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm i -g pnpm@11

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build wasm
        working-directory: webbvueetauri/src/src-wasm
        run: wasm-pack build

      - name: Build web
        working-directory: webbvueetauri
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: vue-web
          path: webbvueetauri/dist

  release:
    name: Publish Release
    needs: [flutter-android, flutter-macos, vue-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
